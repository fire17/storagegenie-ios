# Build Storage Genie (iOS) in the cloud and upload it to TestFlight.
# Copied from fire17/hero-greetings-ios per /ios-testflight; archive UNSIGNED (constellation flags, cert-cap pitfall).
#
# PUBLIC-REPO SAFE: only manual / own-tag triggers (never pull_request*), read-only token, pinned actions,
# no artifacts (an .ipa or log would be downloadable by anyone), the key file is deleted at the end.
#
# Signing: Xcode automatic + cloud-managed certificates, authenticated with an
# App Store Connect API key (no fastlane match, no certificates in the repo).
# The API key must have the Admin role (cloud-managed distribution certificates need it).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID      App Store Connect API key ID (10 chars)
#   ASC_ISSUER_ID   Issuer ID (UUID)
#   ASC_KEY_P8      base64 of the AuthKey_<KEY_ID>.p8 file   (base64 -i AuthKey_XXXX.p8 | pbcopy)
#   APPLE_TEAM_ID   Developer team ID (10 chars)
#
# Triggers: manual (Actions -> iOS TestFlight -> Run workflow) or a pushed tag ios-v*.
# Deliberately no push-on-main / paths auto-build.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

concurrency:
  group: storagegenie-ios-testflight
  cancel-in-progress: false

env:
  # Pinned. Must be an Xcode whose iOS simulator runtime is installed on the runner
  # (actool refuses to compile the asset catalog otherwise — Xcode 26.0 failed for that
  # reason on macos-26-arm64 20260907). 26.6 = SDK iOS 26.5, runtime present. Check:
  # https://github.com/actions/runner-images (macOS 26 arm64 -> Xcode / Installed SDKs).
  XCODE_VERSION: "26.6"
  PROJECT_DIR: .
  SCHEME: StorageGenie

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on this runner. Available:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Check secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; missing=1; }
          done
          exit $missing

      - name: Install the API key (never printed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # altool looks for the key in ~/.appstoreconnect/private_keys/AuthKey_<ID>.p8
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Generate the Xcode project (XcodeGen)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Core selftest (pure Swift, no signing)
        working-directory: ${{ env.PROJECT_DIR }}/StorageGenieCore
        run: swift run sgcore-selftest

      - name: Archive (build ${{ github.run_number }})
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project StorageGenie.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StorageGenie.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '^(\*\*|error:|warning: .*sign|.*ARCHIVE)' || true
          test -d "$RUNNER_TEMP/StorageGenie.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export IPA
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StorageGenie.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        # xcodebuild uploads the archive itself when ExportOptions has destination=upload.
        # (xcrun altool on the Xcode 26.6 runner fails: "Defaults.properties couldn't be opened".)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cp "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/ExportOptions-upload.plist"
          plutil -replace destination -string upload "$RUNNER_TEMP/ExportOptions-upload.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StorageGenie.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
